name: Verify metric distortion 2.13609

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v4-certificates:
    name: Current v4 certificate (2.13609)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      - name: Test interval bounds and rejection of corrupted inputs
        run: python3 -B -m unittest discover -s tests -v
      - name: Verify every v4 upper-bound polynomial domain
        run: python3 -B certificate_distortion.py --full --output-dir verification-results
      - name: Verify the v4 integer lower-bound arithmetic
        run: python3 -B certificate_lower_bound.py

  archived-certificates:
    name: Archived v1 and v2 certificates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Test the archived generic Bernstein checker
        working-directory: v2
        run: python3 -B -m unittest discover -s tests -v
      - name: Verify the archived v1 upper bound
        run: python3 -B v1/certificate_distortion_v1.py
      - name: Verify the archived v2 upper bound
        run: python3 -B v2/certificate_distortion.py
      - name: Verify the archived v2 lower-bound certificate
        run: python3 -B v2/certificate_lower_bound.py
